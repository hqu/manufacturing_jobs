<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manufacturing Employment by County</title>
  <link rel="icon" href="data:,">
  <link
    rel="stylesheet"
    href="./vendor/leaflet/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <style>
    :root {
      --bg: #26323d;
      --panel: rgba(251, 251, 253, 0.98);
      --ink: #24282f;
      --muted: #5b5e69;
      --border: rgba(154, 161, 177, 0.28);
      --shadow: 0 18px 42px rgba(16, 24, 32, 0.22);
      --font-ui: "Avenir Next", "Segoe UI", sans-serif;
      --map-empty: #e5e5ea;
      --accent: #cc1f36;
      --accent-soft: #f3c7d0;
      --accent-mid: #e88a9d;
      --navy-soft: #5e618a;
      --panel-edge: #e5e7eb;
      --compare-divider-width: 24px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-ui);
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(241, 48, 129, 0.16) 0, rgba(241, 48, 129, 0.16) 48px, transparent 48px),
        linear-gradient(180deg, #26323d 0%, #2f3c49 100%);
    }

    .layout {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 100vh;
      padding: 8px 24px 14px;
      width: 100%;
      max-width: none;
      margin: 0 auto;
      overflow-x: auto;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .panel {
      background: var(--panel);
      backdrop-filter: blur(10px);
      padding: 14px 16px 10px;
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr) 340px;
      gap: 14px;
      align-items: stretch;
    }

    .panel.is-compare-active {
      grid-template-columns: 170px minmax(0, 1fr) 280px;
    }

    .control-step {
      min-width: 0;
    }

    .control-step + .control-step {
      border-left: 2px solid rgba(36, 40, 47, 0.18);
      padding-left: 18px;
    }

    .step-stack .control-step + .control-step {
      border-left: none;
      padding-left: 0;
      border-top: 1px solid rgba(36, 40, 47, 0.14);
      padding-top: 8px;
    }

    .control-step.step-job .option-button {
      font-size: 14px;
    }

    .control-step.step-1 .option-button {
      font-size: 11px;
    }

    .control-step.step-1 .option-stack {
      gap: 0;
    }

    .control-step.step-stack {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .control-step.step-2 {
      width: calc(110% + 50px);
      justify-self: start;
    }

    .control-step.step-date {
      width: 100%;
      justify-self: stretch;
    }

    .step-heading {
      margin: 0 0 10px;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 400;
      color: var(--ink);
    }

    .step-heading-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .step-heading-row .step-heading {
      margin: 0;
    }

    .step-heading strong {
      font-weight: 700;
    }

    .eyebrow {
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--accent);
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 31px;
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .lede,
    .small {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 13px;
      font-weight: 400;
    }

    .stat-card,
    .info-card {
      background: #ffffff;
      border: 1px solid var(--panel-edge);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 6px 18px rgba(36, 40, 47, 0.06);
    }

    .time-card {
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(36, 40, 47, 0.08);
      box-shadow: 0 10px 24px rgba(36, 40, 47, 0.08);
      background: #ffffff;
      min-height: 172px;
      height: 172px;
    }

    .time-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 14px 6px;
      background: #24282f;
      color: #ffffff;
    }

    .time-card-title {
      margin: 0;
      font-size: 11px;
      line-height: 1.2;
      font-weight: 600;
      text-align: right;
    }

    .time-card-bottom {
      padding: 0 14px 12px;
      background: #fbfbfd;
    }

    .option-stack {
      display: grid;
      gap: 4px;
    }

    .option-button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 4px 0;
      border: none;
      background: transparent;
      color: var(--ink);
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: color 160ms ease;
    }

    .option-button::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 999px;
      border: 1.5px solid rgba(36, 40, 47, 0.48);
      background: #ffffff;
      box-shadow: inset 0 0 0 3px #ffffff;
    }

    .option-button.is-active {
      color: var(--ink);
      font-weight: 600;
    }

    .option-button:disabled {
      color: #a6adb8;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .option-button.is-active::before {
      border-color: #111111;
      background: #111111;
    }

    .stat-label {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0;
      text-transform: none;
      font-weight: 500;
    }

    .stat-value {
      margin: 0;
      font-size: 14px;
      line-height: 1.05;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .slider-endpoints {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      color: #bcc3cd;
      font-size: 8px;
      font-weight: 400;
    }

    .compare-slider-endpoints {
      display: none;
    }

    .compare-block {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(36, 40, 47, 0.12);
    }

    .compare-block.is-hidden {
      display: none;
    }

    .compare-toggle-btn {
      margin-top: 0;
      margin-left: 0;
      width: auto;
      border: 1px solid #8f98a8;
      background: linear-gradient(180deg, #f3f5f9 0%, #dfe4ec 100%);
      color: #222933;
      border-radius: 0;
      padding: 5px 14px;
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 2px 0 #aeb6c4, 0 3px 8px rgba(36, 40, 47, 0.12);
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }

    .compare-toggle-btn:disabled {
      background: #d2d7e0;
      color: #f6f7fa;
      border-color: #d2d7e0;
      cursor: not-allowed;
      box-shadow: none;
    }

    .compare-toggle-btn.is-hidden {
      display: none;
    }

    .compare-toggle-btn:hover:not(:disabled),
    .exit-compare-btn:hover {
      background: linear-gradient(180deg, #ffffff 0%, #e7ebf2 100%);
      box-shadow: 0 2px 0 #9aa3b3, 0 5px 10px rgba(36, 40, 47, 0.16);
      transform: translateY(-1px);
    }

    .compare-toggle-btn:active:not(:disabled),
    .exit-compare-btn:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 #9aa3b3, 0 2px 5px rgba(36, 40, 47, 0.12);
    }

    .compare-toggle-row {
      display: flex;
      justify-content: center;
      margin-top: -7px;
      margin-bottom: 4px;
    }

    .compare-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 2px;
    }

    .compare-label {
      margin: 0;
      color: var(--ink);
      font-size: 8px;
      line-height: 1.2;
      font-weight: 400;
      white-space: normal;
    }

    .compare-step-heading {
      margin: 0;
      font-size: 12px;
      line-height: 1.2;
      font-weight: 400;
      color: var(--ink);
    }

    .compare-step-prefix {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
    }

    .compare-date {
      margin: 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.2;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      width: 100%;
      display: block;
    }

    #month-slider,
    #compare-slider {
      accent-color: #32353e;
      appearance: none;
      -webkit-appearance: none;
      height: 22px;
      background: transparent;
      cursor: grab;
      --slider-track-h: 13px;
      --slider-thumb-sz: 22px;
    }

    #month-slider::-webkit-slider-runnable-track,
    #compare-slider::-webkit-slider-runnable-track {
      height: var(--slider-track-h);
      border-radius: 999px;
      background: #d9dde5;
      border: 1px solid #c8ceda;
    }

    #month-slider::-moz-range-track,
    #compare-slider::-moz-range-track {
      height: var(--slider-track-h);
      border-radius: 999px;
      background: #d9dde5;
      border: 1px solid #c8ceda;
    }

    #month-slider::-webkit-slider-thumb,
    #compare-slider::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: var(--slider-thumb-sz);
      height: var(--slider-thumb-sz);
      margin-top: calc((var(--slider-track-h) - var(--slider-thumb-sz)) / 2);
      border-radius: 999px;
      border: 2px solid #ffffff;
      background: #111111;
      box-shadow: 0 3px 8px rgba(17, 17, 17, 0.28);
      cursor: grab;
    }

    #month-slider::-moz-range-thumb,
    #compare-slider::-moz-range-thumb {
      width: var(--slider-thumb-sz);
      height: var(--slider-thumb-sz);
      border-radius: 999px;
      border: 2px solid #ffffff;
      background: #111111;
      box-shadow: 0 3px 8px rgba(17, 17, 17, 0.28);
      cursor: grab;
    }

    #month-slider:active,
    #compare-slider:active,
    #month-slider::-webkit-slider-thumb:active,
    #compare-slider::-webkit-slider-thumb:active,
    #month-slider::-moz-range-thumb:active,
    #compare-slider::-moz-range-thumb:active {
      cursor: grabbing;
    }

    #compare-slider {
      margin-bottom: 0;
    }

    .date-select-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      flex-wrap: wrap;
    }

    .current-date-select-wrap {
      transition: transform 520ms ease;
      will-change: transform;
    }

    .compare-vs-divider {
      display: none;
      align-items: center;
      justify-content: center;
      color: #7b8290;
      font-family: var(--font-ui);
      font-size: 10px;
      font-weight: 700;
      text-transform: lowercase;
      letter-spacing: 0.02em;
      width: var(--compare-divider-width);
      padding: 0;
      border: none;
      min-height: 34px;
    }

    .current-date-select-wrap,
    .compare-date-select-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .compare-date-select-wrap.is-hidden {
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      transform: translateX(-18px);
    }

    .compare-date-select-wrap {
      max-width: 240px;
      opacity: 1;
      transform: translateX(0);
      transition: max-width 560ms ease, opacity 440ms ease, transform 560ms ease;
      will-change: max-width, opacity, transform;
    }

    .date-select {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-family: var(--font-ui);
      font-size: 9px;
      font-weight: 600;
      line-height: 1.2;
      padding: 8px 29px 8px 11px;
      min-width: 84px;
      background-image:
        linear-gradient(45deg, transparent 50%, rgba(255, 255, 255, 0.8) 50%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.8) 50%, transparent 50%);
      background-position:
        calc(100% - 18px) calc(50% - 1px),
        calc(100% - 12px) calc(50% - 1px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      cursor: pointer;
    }

    #month-select.date-select {
        min-width: 92px;
        font-weight: 700;
        padding-right: 32px;
      }

    #year-select.date-select {
        min-width: 62px;
        max-width: 62px;
        padding-right: 26px;
        padding-left: 9px;
      }

    #compare-month-select.date-select {
        min-width: 92px;
        font-weight: 700;
        padding-right: 32px;
      }

    #compare-year-select.date-select {
        min-width: 62px;
        max-width: 62px;
        padding-right: 26px;
        padding-left: 9px;
      }

    .date-select option {
      color: var(--ink);
      background: #ffffff;
    }

    .compare-close-row {
      display: flex;
      justify-content: center;
      margin-top: 4px;
      margin-bottom: 10px;
    }

    .date-range-error {
      display: none;
      margin-top: 4px;
      margin-bottom: 6px;
      border: 2px solid #000000;
      border-radius: 6px;
      padding: 4px 8px;
      text-align: center;
      font-size: 10px;
      color: #b63f52;
      font-weight: 600;
      line-height: 1.2;
    }

    .date-range-error.is-visible {
      display: block;
    }

    .exit-compare-btn {
      border: 1px solid #8f98a8;
      background: linear-gradient(180deg, #f3f5f9 0%, #dfe4ec 100%);
      color: #222933;
      border-radius: 0;
      padding: 5px 14px;
      margin: 0;
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.2;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 0 #aeb6c4, 0 3px 8px rgba(36, 40, 47, 0.12);
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }

    .exit-compare-btn.is-hidden {
      display: none;
    }

    .field-stack {
      display: grid;
      gap: 3px;
    }

    .slider-layout {
      display: block;
      position: relative;
      --slider-side-pad-left: 20px;
      --slider-side-pad-right: 35px;
    }

    .slider-layout > .slider-col,
    .slider-layout > .compare-range-ui,
    .slider-layout > .slider-endpoints {
      width: calc(100% - var(--slider-side-pad-left) - var(--slider-side-pad-right));
      margin-left: var(--slider-side-pad-left);
      box-sizing: border-box;
    }

    .slider-layout:not(.is-compare) .slider-col {
      justify-content: flex-start;
    }

    .slider-layout:not(.is-compare) {
      margin-top: 0;
    }

    .slider-col {
      width: 100%;
      align-self: start;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .slider-col input[type="range"] {
      display: block;
      margin-top: 0;
      vertical-align: top;
    }

    .slider-selected-date {
      position: absolute;
      top: 0;
      left: 0;
      transform: translate(-50%, -115%);
      font-size: 9px;
      color: #5b5e69;
      font-weight: 600;
      pointer-events: none;
      white-space: nowrap;
      z-index: 2;
    }

    .slider-selected-date.is-right {
      transform: translate(-50%, -115%);
    }

    .current-slider-col {
      transition: transform 520ms ease;
      will-change: transform;
    }

    .compare-slider-col.is-hidden {
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
      transform: translateX(-18px);
    }

    .compare-slider-col {
      max-width: 100%;
      opacity: 1;
      transform: translateX(0);
      transition: max-width 560ms ease, opacity 440ms ease, transform 560ms ease;
      will-change: max-width, opacity, transform;
    }

    .slider-layout.is-compare {
      display: block;
      margin-top: 20px;
      min-height: 58px;
      padding-top: 10px;
      padding-bottom: 0;
    }

    .slider-layout.is-compare #month-slider,
    .slider-layout.is-compare #compare-slider {
      --slider-track-h: 13px;
      --slider-thumb-sz: 28px;
    }

    .slider-vs-divider {
      display: none;
      align-items: center;
      justify-content: center;
      color: transparent;
      font-size: 0;
      width: var(--compare-divider-width);
      padding: 0;
      border: none;
      min-height: 24px;
      margin-top: 2px;
      position: relative;
    }

    .slider-vs-divider::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 1px;
      background: rgba(36, 40, 47, 0.18);
    }

    .slider-layout.is-compare .slider-vs-divider,
    .date-select-wrap.is-compare .compare-vs-divider {
      display: inline-flex;
    }

    .slider-layout.is-compare .slider-vs-divider {
      display: none;
    }

    .slider-layout.is-compare .slider-col {
      position: absolute;
      left: var(--slider-side-pad-left);
      right: var(--slider-side-pad-right);
      top: 9px;
      z-index: 2;
      width: auto;
      margin-left: 0;
    }

    .slider-layout.is-compare .compare-slider-col,
    .slider-layout.is-compare .current-slider-col {
      max-width: none;
      opacity: 1;
      transform: none;
    }

    .slider-layout.is-compare .current-slider-col {
      z-index: 3;
    }

    .slider-layout.is-compare input[type="range"] {
      pointer-events: none;
      background: transparent;
      opacity: 0;
    }

    .slider-layout.is-compare input[type="range"]::-webkit-slider-runnable-track {
      background: transparent;
      border-color: transparent;
    }

    .slider-layout.is-compare input[type="range"]::-moz-range-track {
      background: transparent;
      border-color: transparent;
    }

    .slider-layout.is-compare input[type="range"]::-webkit-slider-thumb {
      pointer-events: auto;
    }

    .slider-layout.is-compare input[type="range"]::-moz-range-thumb {
      pointer-events: auto;
    }

    .date-select-wrap.is-compare {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--compare-divider-width) minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .date-select-wrap.is-compare .compare-date-select-wrap,
    .date-select-wrap.is-compare .current-date-select-wrap {
      width: 100%;
      justify-content: center;
    }

    .date-select-wrap.is-compare .current-date-select-wrap {
      transform: translateX(8px);
    }

    .slider-layout.is-compare .current-slider-col {
      transform: none;
      padding-right: 0;
    }

    .slider-layout.is-compare .slider-endpoints {
      position: relative;
      z-index: 1;
      margin-top: 36px;
    }

    .compare-range-ui {
      display: none;
      position: absolute;
      left: var(--slider-side-pad-left);
      right: var(--slider-side-pad-right);
      top: 8px;
      height: 32px;
      z-index: 4;
      --range-start: 0%;
      --range-end: 100%;
      touch-action: none;
      width: auto;
      margin-left: 0;
    }

    .compare-range-ui.is-active {
      display: block;
    }

    .compare-range-ui::before,
    .compare-range-ui::after {
      content: "";
      position: absolute;
      top: 10px;
      height: 13px;
      border-radius: 999px;
      pointer-events: none;
    }

    .compare-range-ui::before {
      left: 0;
      right: 0;
      background: #d9dde5;
      border: 1px solid #c8ceda;
    }

    .compare-range-ui::after {
      left: var(--range-start);
      right: calc(100% - var(--range-end));
      background: #5f699e;
      border: 1px solid rgba(95, 105, 158, 0.55);
    }

    .compare-range-thumb {
      position: absolute;
      top: 2px;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      border: 2px solid #ffffff;
      background: #111111;
      box-shadow: 0 3px 8px rgba(17, 17, 17, 0.28);
      transform: translateX(-50%);
      cursor: grab;
      touch-action: none;
      z-index: 2;
    }

    .compare-range-thumb.is-dragging,
    .compare-range-thumb:active {
      cursor: grabbing;
    }

    .filter-choice {
      display: grid;
      gap: 4px;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--panel-edge);
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(36, 40, 47, 0.04);
      transition: border-color 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
    }

    .filter-choice input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .step-job .field-stack {
      gap: 6px;
    }

    .step-job .filter-choice {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      cursor: pointer;
    }

    .step-job .filter-choice input {
      position: static;
      opacity: 1;
      pointer-events: auto;
      width: 10px;
      height: 10px;
      appearance: none;
      -webkit-appearance: none;
      border-radius: 999px;
      border: 1.5px solid rgba(36, 40, 47, 0.48);

    function hexToRgb(hex) {
      const normalized = hex.replace("#", "");
      const value = normalized.length === 3
        ? normalized.split("").map((c) => c + c).join("")

      return {
        r: parseInt(value.slice(0, 2), 16),
        g: parseInt(value.slice(2, 4), 16),

    function rgbToHex(rgb) {

      return `#${toHex(rgb.r)}${toHex(rgb.g)}${toHex(rgb.b)}`;
    }

    function interpolateColor(colorA, colorB, t) {
      const a = hexToRgb(colorA);
      const b = hexToRgb(colorB);
      return rgbToHex({
        r: a.r + (b.r - a.r) * t,
        g: a.g + (b.g - a.g) * t,
        b: a.b + (b.b - a.b) * t

    }

    function computeScaleDomain() {
      const values = getCurrentMetricValues();
      if (!values.length) {
        return isComparisonActive
          ? { min: -0.01, max: 0.01, maxAbs: 0.01 }
          : { min: 0, minPositive: 1, max: 1, hasZero: false };
      }
      if (isComparisonActive) {
        const maxAbs = Math.max(...values.map((value) => Math.abs(value)));
        const nonZeroAbsValues = values
          .map((value) => Math.abs(value))
          .filter((value) => value > 0);
        const minAbs = nonZeroAbsValues.length ? Math.min(...nonZeroAbsValues) : 0.01;
        return { min: -maxAbs, max: maxAbs, maxAbs: Math.max(maxAbs, 0.01), minAbs: Math.max(minAbs, 0.01) };
      }
      const positiveValues = values.filter((value) => value > 0);
      return {
        min: Math.min(...values),
        minPositive: positiveValues.length ? Math.min(...positiveValues) : 1,
        max: Math.max(...values),
        hasZero: values.some((value) => value === 0)
      };
    }

    function colorFor(value) {
      if (!Number.isFinite(value)) {
        return "#e5e5ea";

      const domain = getScaleDomain();
      if (isComparisonActive) {
        if (value === 0) {
          return "#d9d9e2";
        }
        const isJobsMetric = currentDisplayMetric !== "percent";
        let absNormalized;
        if (isJobsMetric) {
          const safeAbs = Math.max(Math.abs(value), domain.minAbs || 0.01);
          const logMin = Math.log10(domain.minAbs || 0.01);
          const logMax = Math.log10(domain.maxAbs || 1);
          absNormalized = logMax <= logMin ? 1 : (Math.log10(safeAbs) - logMin) / (logMax - logMin);
        } else {
          absNormalized = Math.abs(value) / (domain.maxAbs || 0.01);
        }
        const normalized = Math.max(0, Math.min(1, absNormalized));
        const activePalette = value < 0 ? negativePalette : positivePalette;
        const scaled = normalized * (activePalette.length - 1);
        const index = Math.min(activePalette.length - 2, Math.floor(scaled));
        const localT = scaled - index;
        return interpolateColor(activePalette[index], activePalette[index + 1], localT);
      }

      if (value === 0) {
        return basePalette[0];
      }

      if (currentDisplayMetric === "percent") {
        if (domain.max <= domain.min) {
          return basePalette[basePalette.length - 1];
        }
        const normalized = (value - domain.min) / (domain.max - domain.min);
        const clamped = Math.max(0, Math.min(1, normalized));
        const scaled = clamped * (basePalette.length - 1);
        const index = Math.min(basePalette.length - 2, Math.floor(scaled));
        const localT = scaled - index;
        return interpolateColor(basePalette[index], basePalette[index + 1], localT);
      }

      if (domain.max <= domain.minPositive) {
        return basePalette[basePalette.length - 1];
      }
      const logMin = Math.log10(domain.minPositive);
      const logMax = Math.log10(domain.max);
      const normalized = (Math.log10(value) - logMin) / (logMax - logMin);
      const clamped = Math.max(0, Math.min(1, normalized));
      const scaled = clamped * (basePalette.length - 1);
      const index = Math.min(basePalette.length - 2, Math.floor(scaled));
      const localT = scaled - index;
      return interpolateColor(basePalette[index], basePalette[index + 1], localT);
    }

    function getLegendTargetValueFromPosition(t) {
      const clampedT = Math.max(0, Math.min(1, t));
      const domain = getScaleDomain();
      if (isComparisonActive) {
        const signedPosition = clampedT * 2 - 1;
        if (signedPosition === 0) return 0;
        if (currentDisplayMetric === "percent") return signedPosition * domain.maxAbs;
        const logMin = Math.log10(domain.minAbs || 0.01);
        const logMax = Math.log10(domain.maxAbs || 0.01);
        return Math.sign(signedPosition) * 10 ** (logMin + Math.abs(signedPosition) * (logMax - logMin));
      }
      if (currentDisplayMetric === "percent") {
        return domain.min + (domain.max - domain.min) * clampedT;
      }
      if (domain.max <= domain.minPositive) {
        return domain.max;
      }
      const logMin = Math.log10(domain.minPositive);
      const logMax = Math.log10(domain.max);
      return 10 ** (logMin + (logMax - logMin) * clampedT);
    }

    function getLegendTransformedValue(value) {
      const domain = getScaleDomain();
      if (isComparisonActive && currentDisplayMetric !== "percent") {
        const minAbs = Math.max(domain.minAbs || 0.01, 0.01);
        if (!Number.isFinite(value) || value === 0) return 0;
        const logMin = Math.log10(minAbs);
        const logMax = Math.log10(domain.maxAbs || minAbs);
        const normalized = logMax <= logMin ? 1 : (Math.log10(Math.max(Math.abs(value), minAbs)) - logMin) / (logMax - logMin);
        return Math.sign(value) * normalized;
      }
      if (!isComparisonActive && currentDisplayMetric !== "percent") {
        const minPositive = Math.max(domain.minPositive || 1, 1e-9);
        return Math.log10(Math.max(value, minPositive));
      }
      return value;
    }

    function clearLegendHoverHighlights() {
      legendHoverLabelLayer?.clearLayers();
      legendHoveredLayers.forEach((layer) => {
        if (layer !== hoveredLayer && layer !== listHoveredLayer && !zeroListHoveredLayers.includes(layer)) {
          geojson.resetStyle(layer);
        }
      });
      legendHoveredLayers = [];
    }

    function applyLegendHoverByValue(targetValue) {
      if (!geojson || targetValue == null || !Number.isFinite(targetValue)) return;

      const rows = [];
      geojson.eachLayer((layer) => {
        const county = String(layer.feature.properties.county_id);
        const value = getCurrentValueForCounty(county);
        if (!Number.isFinite(value)) return;
        rows.push({ layer, county, value, t: getLegendTransformedValue(value) });
      });
      if (!rows.length) return;

      const targetT = getLegendTransformedValue(targetValue);
      const tValues = rows.map((row) => row.t);
      const band = Math.max((Math.max(...tValues) - Math.min(...tValues)) / 80, 1e-9);

      let matches = rows.filter((row) => Math.abs(row.t - targetT) <= band);
      if (!matches.length) {
        let closest = rows[0];
        let closestDist = Math.abs(rows[0].t - targetT);
        for (let i = 1; i < rows.length; i += 1) {
          const d = Math.abs(rows[i].t - targetT);
          if (d < closestDist) {
            closest = rows[i];
            closestDist = d;
          }
        }
        matches = [closest];
      }

      clearLegendHoverHighlights();
      const labelPoints = [];
      matches.forEach(({ layer, county, value }) => {
        layer.setStyle({
          weight: 1.8,
          color: "#4a4f66",
          fillColor: colorFor(value),
          fillOpacity: 0.98
        });
        legendHoveredLayers.push(layer);

        const center = layer.getBounds().getCenter();
        const point = map.latLngToContainerPoint(center);
        if (labelPoints.length >= 10 || !map.getBounds().contains(center) || labelPoints.some(other => Math.abs(other.x - point.x) < 145 && Math.abs(other.y - point.y) < 36)) return;
        labelPoints.push(point);
        const marker = L.marker(center, {
          interactive: false,
          icon: L.divIcon({
            className: "region-label-icon",
            html: `<div class="region-label">${countyName(county)}</div>`
          })
        });
        legendHoverLabelLayer?.addLayer(marker);
      });
    }

    function shortRegionName(name) {
      return (name || "")
        .replace(/\s*,\s*[A-Z]{2}(?:-[A-Z]{2})?$/, "")
        .replace(/\s+Surrounding$/, "");
    }

    function hoverMetricClass(metricKey) {
      return currentMetric === metricKey ? "is-active" : "is-muted";
    }

    function getInfoValue(record, metricKey) {
      if (!record) return "Data unavailable";
      if (currentDisplayMetric === "percent") {
        return formatPercent(record[metricConfig[metricKey].percentKey]);
      }
      return formatNumber(record[metricKey]);
    }

    function getSelectedInfoLine(record) {
      return `<p class="is-active"><span class="hover-emphasis">${getCurrentMetricConfig().infoLabel}: ${getInfoValue(record, currentMetric)}</span> out of ${formatNumber(record.emplvl_total)} total jobs</p>`;
    }

    function getNationalTrendSeries() {
      if (aggregateTrendCache.has(currentMetric)) return aggregateTrendCache.get(currentMetric);
      const sectorIdx = metricIndex.get(currentMetric);
      const totalIdx = metricIndex.get("emplvl_total");
      const trend = allDates.map((date, index) => {
        let count = 0, countCoverage = 0, numerator = 0, denominator = 0, shareCoverage = 0;
        bundle.values[index].forEach((values) => {
          const sector = values[sectorIdx], total = values[totalIdx];
          if (isObserved(sector)) { count += sector; countCoverage++; }
          if (isObserved(sector) && isObserved(total) && total > 0) {
            numerator += sector; denominator += total; shareCoverage++;
          }
        });
        return {date, count: countCoverage ? count : null, rate: denominator > 0 ? numerator / denominator : null,
          countCoverage, shareCoverage};
      });
      aggregateTrendCache.set(currentMetric, trend);
      return trend;
    }

    function getCountyTrendSeries(county) {
      return allDates.map((date) => ({date, value: getValue(county, date)}));
    }

    function buildNationalTrendPathFromGeometry(points) {
      let previousValid = false;
      return points.map((point) => {
        if (!Number.isFinite(point.value)) { previousValid = false; return ""; }
        const command = previousValid ? "L" : "M";
        previousValid = true;
        return `${command} ${point.x.toFixed(2)} ${point.y.toFixed(2)}`;
      }).join(" ");
    }

    function trendMarkup(series, title, aggregate = false) {
      const width = 360, height = 110;
      const left = 74, right = 10, top = 8, bottom = 22;
      const first = isComparisonActive ? dateIndex.get(comparisonDate) : 0;
      const last = isComparisonActive ? dateIndex.get(currentDate) : allDates.length - 1;
      const visible = series.slice(first, last + 1);
      const known = visible.map((row) => row.value).filter(Number.isFinite);
      const max = known.length ? Math.max(...known, 0) : 0;
      const span = Math.max(max, 1e-9);
      const points = visible.map((row, index) => ({...row,
        x: left + 8 + index / Math.max(visible.length - 1, 1) * (width - left - right - 8),
        y: Number.isFinite(row.value) ? top + (max - row.value) / span * (height - top - bottom) : null}));
      const current = points[dateIndex.get(currentDate) - first];
      const startValue = series[dateIndex.get(comparisonDate)]?.value;
      const endValue = series[dateIndex.get(currentDate)]?.value;
      const delta = Number.isFinite(startValue) && Number.isFinite(endValue) ? endValue - startValue : null;
      const formatValue = (value) => currentDisplayMetric === "percent" ? formatPercent(value) : formatChartCompactValue(value);
      const label = isComparisonActive ? formatComparisonChangeValue(delta) : formatValue(current?.value);
      const xFor = (index) => left + 8 + (index - first) / Math.max(last - first, 1) * (width - left - right - 8);
      // Reserve space for the longer endpoint labels before adding year ticks.
      const ticks = [first];
      allDates.forEach((date, index) => {
        if (index <= first || index >= last || getMonthValue(date) !== "01" || Number(getYearValue(date)) % 5 !== 0) return;
        if (xFor(index) - xFor(first) < 60 || xFor(last) - xFor(index) < 60 || xFor(index) - xFor(ticks[ticks.length - 1]) < 42) return;
        ticks.push(index);
      });
      if (last !== first) ticks.push(last);
      const coverage = aggregate ? series[dateIndex.get(currentDate)]?.coverage : null;
      const startCoverage = aggregate ? series[dateIndex.get(comparisonDate)]?.coverage : null;
      const note = aggregate ? `<p class="coverage-note">${isComparisonActive ? `${formatMonthYearCompact(comparisonDate)}: ${formatNumber(startCoverage)}; ` : ""}${formatMonthYearCompact(currentDate)}: ${formatNumber(coverage)} of ${formatNumber(bundle.counties.length)} counties reported${currentDisplayMetric === "percent" ? " both sector and positive total employment; share uses matched counties" : " sector employment"}. Coverage changes can affect trends.</p>` : "";
      return `${aggregate ? `<h3 class="national-trend-title">${title}</h3>` : ""}
        <svg class="national-trend-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="${title}">
          <line class="national-trend-axis-line" x1="${left}" y1="${top}" x2="${left}" y2="${height-bottom}"></line>
          <line class="national-trend-axis-line" x1="${left}" y1="${height-bottom}" x2="${width-right}" y2="${height-bottom}"></line>
          <text class="national-trend-axis" x="${left-4}" y="${top+3}" text-anchor="end">${known.length ? formatValue(max) : ""}</text>
          <text class="national-trend-axis" x="${left-4}" y="${height-bottom}" text-anchor="end">${known.length ? formatValue(0) : ""}</text>
          <path class="national-trend-line" d="${buildNationalTrendPathFromGeometry(points)}"></path>
          ${ticks.map((index) => `<text class="national-trend-axis" x="${xFor(index)}" y="${height-4}" text-anchor="${index === first ? "start" : index === last ? "end" : "middle"}">${index === first || index === last ? formatMonthYearCompact(allDates[index]) : getYearValue(allDates[index])}</text>`).join("")}
          ${points.filter((point) => Number.isFinite(point.value)).map((point) => `<circle class="trend-observation" cx="${point.x}" cy="${point.y}" r="3" fill="transparent"><title>${formatMonthYear(point.date)}: ${formatValue(point.value)}${aggregate ? `; ${point.coverage} counties reported` : ""}</title></circle>`).join("")}
          ${Number.isFinite(current?.value) ? `<circle class="national-trend-point" cx="${current.x}" cy="${current.y}" r="3.2"><title>${title} · ${formatMonthYear(current.date)}: ${formatValue(current.value)}${aggregate ? `; ${current.coverage} counties reported` : ""}</title></circle>` : ""}
          <text class="national-trend-axis national-trend-value-label" x="${width-right}" y="${top+10}" text-anchor="end">${label}</text>
        </svg>${note}`;
    }

    function getNationalTrendMarkup() {
      const share = currentDisplayMetric === "percent";
      return trendMarkup(getNationalTrendSeries().map((row) => ({date: row.date,
        value: share ? row.rate : row.count, coverage: share ? row.shareCoverage : row.countCoverage})),
        `Reported county employment · ${getCurrentMetricConfig().shortLabel}${share ? " share" : " jobs"}`, true);
    }

    function getCountyTrendMarkup(county) {
      return trendMarkup(getCountyTrendSeries(county), `${countyName(county)} employment trend`);
    }

    function setupNationalTrendInteraction() { /* SVG observation titles provide month and value on hover. */ }

    function getRankedRows() {
      ensureStateCache();
      if (!cachedRankings) {
        cachedRankings = bundle.counties.map(({id, name}) => ({county: id, name,
          value: isComparisonActive ? getChangeForRecord(id) : getValue(id, currentDate)}))
          .filter((row) => Number.isFinite(row.value))
          .sort((a, b) => b.value - a.value || a.county.localeCompare(b.county));
      }
      return cachedRankings;
    }

    function renderRankingTables() {
      if (!top10CountyBody || !bottom10CountyBody) return;
      const rows = getRankedRows();
      if (!rows.length) {
        top10CountyBody.innerHTML = `<tr><td class="rank-name">Data unavailable</td><td class="rank-value">-</td><td class="rank-bar-cell"></td></tr>`;
        bottom10CountyBody.innerHTML = `<tr><td class="rank-name">Data unavailable</td><td class="rank-value">-</td><td class="rank-bar-cell"></td></tr>`;
        topFiveCountySet = new Set();
        return;
      }
      const topRows = rows.slice(0, 10);
      const bottomRows = rows.slice(-10).reverse();
      const zeroRows = rows.filter((row) => row.value === 0);
      topFiveCountySet = new Set(topRows.map((row) => String(row.county)));
      const formatValue = (v) => isComparisonActive ? formatComparisonChangeValue(v) : formatDisplayValue(v);
      const maxAbsTop = Math.max(...topRows.map((row) => Math.abs(row.value)), 0);
      const maxAbsBottom = Math.max(...bottomRows.map((row) => Math.abs(row.value)), 0);
      const getBarPct = (value, maxAbs) => maxAbs > 0 ? Math.max(0, Math.min(100, (Math.abs(value) / maxAbs) * 100)) : 0;
      const barClass = (value) => isComparisonActive && value < 0 ? "rank-bar-fill is-negative" : "rank-bar-fill";
      top10CountyBody.innerHTML = topRows
        .map((row) => `<tr data-top-county="${row.county}"><td class="rank-name">${row.name}</td><td class="rank-value">${formatValue(row.value)}</td><td class="rank-bar-cell"><div class="rank-bar-track"><div class="${barClass(row.value)}" style="width:${getBarPct(row.value, maxAbsTop)}%"></div></div></td></tr>`)
        .join("");
      if (!isComparisonActive && zeroRows.length > 10) {
        const metricJobsLabel = `${getCurrentMetricConfig().shortLabel} jobs`;
        const zeroCountyList = zeroRows.map((row) => row.county).join(",");
        bottom10CountyBody.innerHTML = `
          <tr>
            <td class="rank-zero-note" colspan="3" data-zero-hover-counties="${zeroCountyList}">
              There are more than 10 Counties with 0 ${metricJobsLabel}.
            </td>
          </tr>
        `;
      } else {
        bottom10CountyBody.innerHTML = bottomRows
          .map((row) => `<tr data-top-county="${row.county}"><td class="rank-name">${row.name}</td><td class="rank-value">${formatValue(row.value)}</td><td class="rank-bar-cell"><div class="rank-bar-track"><div class="${barClass(row.value)}" style="width:${getBarPct(row.value, maxAbsBottom)}%"></div></div></td></tr>`)
          .join("");
      }
    }

    function renderTopFiveHighlights() {
      if (!geojson || !topFiveLabelLayer) return;
      topFiveLabelLayer.clearLayers();
      return;
    }

    function renderFocusLabel(county, targetLayer, includeValue = true) {
      if (!targetLayer) return;
      targetLayer.clearLayers();
      const layer = findLayerByCounty(county);
      if (!layer) return;
      const value = getCurrentValueForCounty(county);
      const metricValue = isComparisonActive ? formatComparisonChangeValue(value) : formatDisplayValue(value);
      targetLayer.addLayer(L.marker(layer.getBounds().getCenter(), {interactive: false,
        icon: L.divIcon({className: "region-label-icon", html: `<div class="region-label is-focus">${includeValue ? `<span class="region-label-value">${metricValue}</span>` : ""}${countyName(county)}</div>`})}));
    }

    function renderPinnedLabel() {
      renderFocusLabel(pinnedCounty, pinnedLabelLayer, true);
      updateRegionLabels();
    }

    function renderHoverLabel(county, includeValue = true) {
      if (county != null && pinnedCounty != null && String(county) === String(pinnedCounty)) {
        hoverLabelLayer?.clearLayers();
        updateRegionLabels();
        return;
      }
      renderFocusLabel(county, hoverLabelLayer, includeValue);
      updateRegionLabels();
    }

    function updateRegionLabels() {
      if (!labelLayer) return;
      labelLayer.clearLayers();
      if (isFullView || map.getZoom() < 7) return;
      const bounds = map.getBounds();
      const occupied = [];
      const focused = new Set([hoveredCounty, pinnedCounty].filter((id) => id != null).map(String));
      for (const id of focused) {
        const layer = layerByCounty.get(id);
        if (layer) occupied.push(map.latLngToContainerPoint(layer.getBounds().getCenter()));
      }
      for (const [id, layer] of layerByCounty) {
        if (focused.has(id) || !bounds.intersects(layer.getBounds())) continue;
        const center = layer.getBounds().getCenter();
        const point = map.latLngToContainerPoint(center);
        if (occupied.some((other) => Math.abs(other.x-point.x) < 140 && Math.abs(other.y-point.y) < 32)) continue;
        occupied.push(point);
        labelLayer.addLayer(L.marker(center, {interactive: false, icon: L.divIcon({
          className: "region-label-icon", html: `<div class="region-label">${countyName(id)}</div>`})}));
        if (occupied.length >= 60) break;
      }
    }

    const info = { _div: countyInfoLine };
    info.update = function(county) {
      if (!county) {
        this._div.innerHTML = `
          ${getNationalTrendMarkup()}
        `;
        setupNationalTrendInteraction();
        return;
      }

      const props = getRecord(county);
      const changeValue = getChangeForRecord(county);

      if (!props) {
        this._div.innerHTML = `
          <h3>${countyName(county)}</h3>
          <p>Data unavailable for ${formatMonthYear(currentDate)}.</p>
        `;
        return;
      }

      this._div.innerHTML = `
        ${isComparisonActive
          ? `<h3>${props.county_name}</h3><p class="hover-change-line">Change from ${comparisonDate} to ${currentDate}: <span class="hover-change-value" style="color:${changeValue == null ? "var(--muted)" : colorFor(changeValue)}">${formatComparisonChangeValue(changeValue)}</span></p>${getCountyTrendMarkup(county, props.county_name)}`
          : `<h3>${props.county_name}</h3>${getSelectedInfoLine(props)}${getCountyTrendMarkup(county, props.county_name)}`
        }
      `;
    };
    info.update();
    function updateOverviewForSize(restoreOverview = true) {
      if (fullViewZoom != null) map.stop();
      // Lower the old desktop minimum before asking Leaflet to fit a smaller screen.
      map.setMinZoom(1);
      fullViewZoom = Math.min(map.getBoundsZoom(mainlandBounds, false, L.point(0, mapTopPaddingPx)) + fullViewZoomBoost, map.getMaxZoom());
      if (restoreOverview) {
        map.fitBounds(mainlandBounds, {animate: false,
          paddingTopLeft: [0, mapTopPaddingPx], paddingBottomRight: [0, 0]});
        if (fullViewZoomBoost) map.setZoom(fullViewZoom, {animate: false});
      }
      map.setMinZoom(fullViewZoom);
    }

    mapResetBtn.addEventListener("click", () => {
      map.stop();
      pinnedCounty = null;
      hoveredCounty = null;
      hoveredLayer = null;
      listHoveredLayer = null;
      activeLayer = null;
      zeroListHoveredLayers = [];
      clearLegendHoverHighlights();
      geojson.setStyle(style);
      updateOverviewForSize(true);
      isFullView = true;
      map.dragging.disable();
      mapResetBtn.classList.add("is-hidden");
      renderPinnedLabel();
      renderHoverLabel(null);
      info.update();
    });

    const legend = {
      update() {
        const div = panelLegend;
        if (!div) return;
        const domain = getScaleDomain();
        if (!getRankedRows().length) {
          div.innerHTML = `<h3>${getLegendLabel()}</h3><div class="legend-note">Data unavailable</div>`;
          return;
        }
        const minLabel = isComparisonActive
          ? formatComparisonChangeValue(domain.min)
          : formatLegendValue(domain.hasZero ? 0 : domain.minPositive);
        const maxLabel = isComparisonActive
          ? formatComparisonChangeValue(domain.max)
          : formatLegendValue(domain.max);
        const legendGradient = isComparisonActive
          ? "linear-gradient(90deg, #b63f52 0%, #d68b96 25%, #d9d9e2 50%, #9ca3c8 75%, #5f699e 100%)"
          : "linear-gradient(90deg, #d9dae8 0%, #5f699e 100%)";
        const logNote = isLogScaleActive()
          ? `<div class="legend-note">Note: colors are in log scale</div>`
          : "";
        div.innerHTML = `
          <h3>${getLegendLabel()}</h3>
          <div class="legend-scale">
            <span class="legend-end">${minLabel}</span>
            <div class="legend-bar" style="background:${legendGradient}" aria-hidden="true"></div>
            <span class="legend-end">${maxLabel}</span>
          </div>
          ${logNote}
          <div class="legend-note"><span style="display:inline-block;width:12px;height:9px;background:#e5e5ea;border:1px solid #8f929b"></span> Data unavailable</div>
        `;
      }
    };

    let activeLayer = null;

    function applyHoverToLayer(layer) {
      hasMapHoverInteracted = true;
      if (mapIntro) mapIntro.classList.add("is-hidden");
      if (hoveredLayer && hoveredLayer !== layer) {
        geojson.resetStyle(hoveredLayer);
        applyPinnedFocusStyles();
      }
      hoveredLayer = layer;
      hoveredCounty = layer.feature.properties.county_id;
      layer.setStyle({
        weight: 1.8,
        color: "#6f738f",
        fillOpacity: 0.97
      });
      if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
        layer.bringToFront();
      }
      renderHoverLabel(layer.feature.properties.county_id);
      info.update(layer.feature.properties.county_id);
      renderTopFiveHighlights();
    }

    function getInfoFocusCounty() {
      if (hoveredCounty != null) return hoveredCounty;
      if (pinnedCounty != null) return pinnedCounty;
      return null;
    }

    function highlightFeature(event) {
      applyHoverToLayer(event.target);
    }

    function applyVisualHighlight(layer) {
      if (!layer) return;
      layer.setStyle({
        weight: 1.8,
        color: "#6f738f",
        fillOpacity: 0.97
      });
      if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
        layer.bringToFront();
      }
    }

    function applyPinnedFocusStyles() {
      if (!geojson || pinnedCounty == null || isFullView) return;
      geojson.eachLayer((layer) => {
        const isPinned = String(layer.feature.properties.county_id) === String(pinnedCounty);
        if (isPinned) {
          applyVisualHighlight(layer);
          return;
        }
        layer.setStyle({
          weight: 0.6,
          color: "#b5b8c2",
          fillOpacity: 0.38,
          opacity: 0.65
        });
      });
    }

    function resetHighlight(event) {
      geojson.resetStyle(event.target);
      if (hoveredLayer === event.target) {
        hoveredLayer = null;
      }
      hoveredCounty = null;
      applyPinnedFocusStyles();
      renderPinnedLabel();
      renderHoverLabel(null);
      info.update(getInfoFocusCounty());
      renderTopFiveHighlights();
    }

    function findLayerByCounty(county) {
      return layerByCounty.get(String(county)) || null;
    }

    function zoomToFeature(event) {
      activeLayer = event.target;
      pinnedCounty = event.target.feature.properties.county_id;
      mapResetBtn.classList.remove("is-hidden");
      isFullView = false;
      map.dragging.enable();
      const targetBounds = activeLayer.getBounds();
      const paddedZoom = map.getBoundsZoom(targetBounds, false, L.point(900, 900));
      const targetZoom = Math.max(fullViewZoom, paddedZoom - 3);
      map.stop();
      map.setView(targetBounds.getCenter(), targetZoom, {animate: false});
      applyPinnedFocusStyles();
      renderPinnedLabel();
      renderHoverLabel(null);
      info.update(getInfoFocusCounty());
    }

    function zoomToCounty(county) {
      const layer = findLayerByCounty(county);
      if (!layer) return;
      zoomToFeature({ target: layer });
    }

    function onEachFeature(feature, layer) {
      layerByCounty.set(String(feature.properties.county_id), layer);
      layer.on({
        mouseover: highlightFeature,
        mouseout: resetHighlight,
        click: zoomToFeature
      });
    }

    geojson = L.geoJSON(bundle.geojson, {
      style,
      onEachFeature
    }).addTo(map);
    hoveredCounty = null;
    geojson.eachLayer((layer) => {
      geojson.resetStyle(layer);
    });
    labelLayer = L.layerGroup().addTo(map);
    hoverLabelLayer = L.layerGroup().addTo(map);
    pinnedLabelLayer = L.layerGroup().addTo(map);
    topFiveLabelLayer = L.layerGroup().addTo(map);
    legendHoverLabelLayer = L.layerGroup().addTo(map);
    renderHoverLabel(null);

    updateOverviewForSize(true);
    map.setMaxBounds(mainlandBounds);
    map.on("moveend zoomend", () => {
      const zoomedIn = map.getZoom() > fullViewZoom;
      isFullView = !zoomedIn;
      mapResetBtn.classList.toggle("is-hidden", isFullView && pinnedCounty == null);
      if (zoomedIn) {
        map.dragging.enable();
      } else {
        map.dragging.disable();
      }
      updateRegionLabels();
      applyPinnedFocusStyles();
      renderPinnedLabel();
      renderHoverLabel(hoveredCounty);
      info.update(getInfoFocusCounty());
      renderTopFiveHighlights();
    });

    map.on("resize", () => {
      updateOverviewForSize(pinnedCounty == null && isFullView);
      updateRegionLabels();
      renderPinnedLabel();
      renderHoverLabel(hoveredCounty);
    });
    // Container resizing also covers layout changes that do not resize the window.
    const mapResizeObserver = new ResizeObserver(() => map.invalidateSize({animate: false, pan: false}));
    mapResizeObserver.observe(document.getElementById("map"));

    map.on("mouseout", () => {
      if (!hoveredCounty) return;
      if (hoveredLayer) {
        geojson.resetStyle(hoveredLayer);
        hoveredLayer = null;
      }
      hoveredCounty = null;
      applyPinnedFocusStyles();
      renderPinnedLabel();
      renderHoverLabel(null);
      info.update(getInfoFocusCounty());
      renderTopFiveHighlights();
    });

    panelLegend?.addEventListener("mousemove", (event) => {
      const bar = event.target.closest(".legend-bar");
      if (!bar) return;
      const rect = bar.getBoundingClientRect();
      if (!rect.width) return;
      const t = (event.clientX - rect.left) / rect.width;
      const targetValue = getLegendTargetValueFromPosition(t);
      applyLegendHoverByValue(targetValue);
    });

    panelLegend?.addEventListener("mouseleave", () => {
      clearLegendHoverHighlights();
    });

    rankingsRow?.addEventListener("mouseover", (event) => {
      const zeroHoverEl = event.target.closest("[data-zero-hover-counties]");
      if (zeroHoverEl) {
        const countyList = new Set((zeroHoverEl.dataset.zeroHoverCounties || "")
          .split(",")
          .map((v) => v.trim())
          .filter(Boolean));
        topFiveLabelLayer?.clearLayers();
        zeroListHoveredLayers.forEach((layer) => geojson.resetStyle(layer));
        zeroListHoveredLayers = [];
        geojson.eachLayer((candidate) => {
          if (!countyList.has(String(candidate.feature.properties.county_id))) return;
          candidate.setStyle({
            weight: 1.8,
            color: "#6f738f",
            fillColor: "#FFFFFF",
            fillOpacity: 0.97
          });
          zeroListHoveredLayers.push(candidate);
        });
        return;
      }

      const row = event.target.closest("tr[data-top-county]");
      if (!row) return;
      const layer = findLayerByCounty(row.dataset.topCounty);
      if (!layer) return;
      topFiveLabelLayer?.clearLayers();
      topFiveCountySet.forEach((id) => {
        const candidate = layerByCounty.get(id);
        if (candidate && candidate !== layer) geojson.resetStyle(candidate);
      });
      if (listHoveredLayer && listHoveredLayer !== layer && listHoveredLayer !== hoveredLayer) {
        geojson.resetStyle(listHoveredLayer);
      }
      listHoveredLayer = layer;
      if (layer !== hoveredLayer) {
        applyVisualHighlight(layer);
      }
      renderHoverLabel(layer.feature.properties.county_id, false);
    });

    rankingsRow?.addEventListener("mouseout", (event) => {
      const zeroHoverEl = event.target.closest("[data-zero-hover-counties]");
      if (zeroHoverEl) {
        const related = event.relatedTarget;
        if (related && zeroHoverEl.contains(related)) return;
        zeroListHoveredLayers.forEach((layer) => {
          if (layer !== hoveredLayer) geojson.resetStyle(layer);
        });
        zeroListHoveredLayers = [];
        if (!hoveredCounty) {
          renderPinnedLabel();
          renderHoverLabel(null);
          renderTopFiveHighlights();
        }
        return;
      }

      const row = event.target.closest("tr[data-top-county]");
      if (!row) return;
      const related = event.relatedTarget;
      if (related && row.contains(related)) return;
      if (listHoveredLayer && listHoveredLayer !== hoveredLayer) {
        geojson.resetStyle(listHoveredLayer);
      }
      listHoveredLayer = null;
      if (!hoveredCounty) {
        renderPinnedLabel();
        renderHoverLabel(null);
        renderTopFiveHighlights();
      }
    });

    rankingsRow?.addEventListener("click", (event) => {
      const row = event.target.closest("tr[data-top-county]");
      if (!row) return;
      zoomToCounty(row.dataset.topCounty);
    });

    function updateDisplayMetricButtons() {
      displayMetricButtons.forEach((button) => {
        const isActive = button.dataset.displayMetric === currentDisplayMetric;
        button.classList.toggle("is-active", isActive);
      });
    }

    function updateMetricChoices() {
      metricChoiceLabels.forEach((label) => {
        const input = label.querySelector('input[name="metric"]');
        const isSelected = input?.value === currentMetric;
        label.classList.toggle("is-selected", isSelected);
        if (input) input.disabled = false;
      });
    }

    function setComparisonActive(active) {
      isComparisonActive = active;
      compareToggleBtn.classList.toggle("is-hidden", active);
      exitCompareBtn.classList.toggle("is-hidden", !active);
      compareDateSelectWrap.classList.toggle("is-hidden", !active);
      compareSliderCol.classList.toggle("is-hidden", !active);
      compareRangeUi?.classList.toggle("is-active", active);
      sliderLayout.classList.toggle("is-compare", active);
      dateSelectWrap.classList.toggle("is-compare", active);
      topPanel?.classList.toggle("is-compare-active", active);
      step3Heading.innerHTML = active
        ? "<strong>Step 3:</strong> Compare 2 Months"
        : "<strong>Step 3:</strong> Select Date";
      if (!active) setDateRangeErrorVisible(false);
      updateSliderSelectedDateLabel(slider, sliderSelectedDate);
      updateSliderSelectedDateLabel(compareSlider, compareSliderSelectedDate);
      updateDateSliderRangeFill();
      requestAnimationFrame(() => {
        updateSliderSelectedDateLabel(slider, sliderSelectedDate);
        updateSliderSelectedDateLabel(compareSlider, compareSliderSelectedDate);
        updateDateSliderRangeFill();
      });
      updateDisplayMetricButtons();
    }

    function setComparisonDateFromIndex(requestedIndex) {
      const currentIndex = allDates.indexOf(currentDate);
      const minAllowedIndex = getCompareMinIndex();
      const maxAllowedIndex = Math.max(0, currentIndex - 1);
      const constrainedIndex = Math.min(Math.max(requestedIndex, minAllowedIndex), maxAllowedIndex);

      if (requestedIndex !== constrainedIndex) {
        setDateRangeErrorVisible(true);
      } else {
        setDateRangeErrorVisible(false);
      }

      compareSlider.value = String(constrainedIndex);
      comparisonDate = allDates[constrainedIndex];
      updateSliderSelectedDateLabel(compareSlider, compareSliderSelectedDate);
      updateDateSliderRangeFill();
      syncCompareDateSelectors();
    }

    function getDateIndexFromCompareRangeX(clientX) {
      if (!compareRangeUi) {
        return 0;
      }
      const rect = compareRangeUi.getBoundingClientRect();
      if (!rect.width) {
        return 0;
      }
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      return Math.round(ratio * (allDates.length - 1));
    }

    function updateCompareThumbDrag(clientX) {
      if (!activeCompareDragThumb) {
        return;
      }
      const nextIndex = getDateIndexFromCompareRangeX(clientX);
      if (activeCompareDragThumb === "start") {
        setComparisonDateFromIndex(nextIndex);
        if (isComparisonActive) {
          refreshMap();
        }
        return;
      }
      setCurrentDate(allDates[nextIndex]);
    }

    function stopCompareThumbDrag() {
      if (compareRangeThumbStart) {
        compareRangeThumbStart.classList.remove("is-dragging");
      }
      if (compareRangeThumbEnd) {
        compareRangeThumbEnd.classList.remove("is-dragging");
      }
      activeCompareDragThumb = null;
      window.removeEventListener("pointermove", onCompareThumbDrag);
      window.removeEventListener("pointerup", stopCompareThumbDrag);
      window.removeEventListener("pointercancel", stopCompareThumbDrag);
    }

    function onCompareThumbDrag(event) {
      updateCompareThumbDrag(event.clientX);
    }

    function startCompareThumbDrag(which, event) {
      if (!isComparisonActive) {
        return;
      }
      event.preventDefault();
      activeCompareDragThumb = which;
      if (which === "start") {
        compareRangeThumbStart?.classList.add("is-dragging");
      } else {
        compareRangeThumbEnd?.classList.add("is-dragging");
      }
      updateCompareThumbDrag(event.clientX);
      window.addEventListener("pointermove", onCompareThumbDrag);
      window.addEventListener("pointerup", stopCompareThumbDrag);
      window.addEventListener("pointercancel", stopCompareThumbDrag);
    }

    function refreshMap() {
      clearLegendHoverHighlights();
      mapTitleText.textContent = isComparisonActive
        ? `${getComparisonTitleBase()} from ${formatMonthYear(comparisonDate)} to ${formatMonthYear(currentDate)}`
        : getMapTitle();
      geojson.setStyle(style);
      applyPinnedFocusStyles();
      updateRegionLabels();
      renderPinnedLabel();
      renderHoverLabel(hoveredCounty);
      renderRankingTables();
      legend.update();
      info.update(getInfoFocusCounty());
      renderTopFiveHighlights();
    }

    slider.addEventListener("input", (event) => {
      setCurrentDate(allDates[Number(event.target.value)]);
    });

    compareSlider.addEventListener("input", (event) => {
      const requestedIndex = Number(event.target.value);
      setComparisonDateFromIndex(requestedIndex);
      if (isComparisonActive) {
        refreshMap();
      }
    });

    compareRangeThumbStart?.addEventListener("pointerdown", (event) => {
      startCompareThumbDrag("start", event);
    });

    compareRangeThumbEnd?.addEventListener("pointerdown", (event) => {
      startCompareThumbDrag("end", event);
    });

    compareToggleBtn.addEventListener("click", () => {
      const latestIndex = allDates.length - 1;
      currentDate = allDates[latestIndex];
      syncSliderToCurrentDate();
      syncDateSelectors();

      const currentIndex = allDates.indexOf(currentDate);
      const minAllowedIndex = getCompareMinIndex();
      const maxAllowedIndex = Math.max(0, currentIndex - 1);
      const targetIndex = Math.min(
        minAllowedIndex,
        maxAllowedIndex
      );
      compareSlider.value = String(targetIndex);
      comparisonDate = allDates[targetIndex];
      syncCompareDateSelectors();
      setComparisonActive(true);
      refreshMap();
    });

    exitCompareBtn.addEventListener("click", () => {
      setComparisonActive(false);
      refreshMap();
    });

    yearSelect.addEventListener("change", () => {
      const yearValue = yearSelect.value;
      buildMonthOptions(yearValue);
      const currentMonth = getMonthValue(currentDate);
      const nextMonth = availableDates.has(`${currentMonth}/${yearValue}`)
        ? currentMonth
        : monthSelect.querySelector("option:not([disabled])")?.value;
      if (!nextMonth) {
        return;
      }
      monthSelect.value = nextMonth;
      setCurrentDate(`${nextMonth}/${yearValue}`);
    });

    monthSelect.addEventListener("change", () => {
      const nextDate = `${monthSelect.value}/${yearSelect.value}`;
      if (!availableDates.has(nextDate)) {
        return;
      }
      setCurrentDate(nextDate);
    });

    compareYearSelect.addEventListener("change", () => {
      const yearValue = compareYearSelect.value;
      buildMonthOptionsForSelect(compareMonthSelect, yearValue);
      const currentMonth = getMonthValue(comparisonDate);
      const nextMonth = availableDates.has(`${currentMonth}/${yearValue}`)
        ? currentMonth
        : compareMonthSelect.querySelector("option:not([disabled])")?.value;
      if (!nextMonth) return;
      compareMonthSelect.value = nextMonth;
      comparisonDate = clampComparisonDateToPast(`${nextMonth}/${yearValue}`);
      syncComparisonSliderConstraint(false);
      if (isComparisonActive) refreshMap();
    });

    compareMonthSelect.addEventListener("change", () => {
      const nextDate = `${compareMonthSelect.value}/${compareYearSelect.value}`;
      if (!availableDates.has(nextDate)) return;
      comparisonDate = clampComparisonDateToPast(nextDate);
      syncComparisonSliderConstraint(false);
      if (isComparisonActive) refreshMap();
    });

    metricInputs.forEach((input) => {
      input.addEventListener("change", (event) => {
        currentMetric = event.target.value;
        updateMetricChoices();
        refreshMap();
      });
    });

    displayMetricButtons.forEach((button) => {
      button.addEventListener("click", () => {
        currentDisplayMetric = button.dataset.displayMetric;
        updateDisplayMetricButtons();
        refreshMap();
      });
    });

    buildYearOptions();
    syncDateSelectors();
    syncCompareDateSelectors();
    updateSliderSelectedDateLabel(slider, sliderSelectedDate);
    updateSliderSelectedDateLabel(compareSlider, compareSliderSelectedDate);
    updateDateSliderRangeFill();
    window.addEventListener("resize", () => {
      updateSliderSelectedDateLabel(slider, sliderSelectedDate);
      updateSliderSelectedDateLabel(compareSlider, compareSliderSelectedDate);
      updateDateSliderRangeFill();
    });
    setComparisonActive(false);
    updateDisplayMetricButtons();
    updateMetricChoices();
    renderRankingTables();
    legend.update();
    updateRegionLabels();
    requestAnimationFrame(() => map.invalidateSize());
  </script>
</body>
</html>
